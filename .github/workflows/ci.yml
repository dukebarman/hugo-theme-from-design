name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Compile Python scripts
        run: |
          python -m py_compile scripts/hugo_theme_check.py scripts/render_theme_preview.py tests/test_hugo_theme_check.py tests/test_render_theme_preview.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

      - name: Validate skill frontmatter
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import yaml

          text = Path("SKILL.md").read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
          assert match, "SKILL.md must start with YAML frontmatter"

          data = yaml.safe_load(match.group(1))
          assert isinstance(data, dict), "Frontmatter must be a YAML mapping"

          allowed = {"name", "description", "license", "allowed-tools", "metadata"}
          extra = set(data) - allowed
          assert not extra, f"Unexpected frontmatter keys: {sorted(extra)}"

          assert data.get("name") == "hugo-theme-from-design"
          assert data.get("description")
          assert data.get("license") == "Apache-2.0"
          PY
